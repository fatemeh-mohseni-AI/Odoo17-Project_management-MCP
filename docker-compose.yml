services:
  odoo-project-mcp:
    build:
      context: .
    image: odoo17-project-mcp:local
    env_file:
      - .env
    init: true
    ports:
      - "${MCP_PUBLISH_HOST:-0.0.0.0}:${MCP_PORT:-31080}:${MCP_PORT:-31080}"
    volumes:
      - odoo_project_mcp_state:/data
    networks:
      - odoo
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          urllib.request.urlopen('http://127.0.0.1:' + os.getenv('MCP_PORT', '31080') + '/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  odoo_project_mcp_state:
    name: odoo17_project_mcp_state

networks:
  odoo:
    external: true
    name: ${ODOO_DOCKER_NETWORK:-odoo_default}
